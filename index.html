<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Quiz & Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Smart Quiz & Weather App</h1>
        <p>Test your knowledge and check the weather!</p>
    </header>

    <main>
        <section class="card" id="quiz">
            <h2>🧠 Interactive Quiz</h2>
            <p id="question">Loading question...</p>
            <div id="answers"></div>
            <p id="quiz-result"></p>
            <button id="next-btn">Next Question</button>
            <p id="score">Score: 0</p>
        </section>

        <section class="card" id="weather">
            <h2>🌤️ Weather Checker</h2>
            <input type="text" id="city" placeholder="Enter city name">
            <button id="weather-btn">Get Weather</button>
            <div id="weather-result">
                Enter a city to see its weather.
            </div>
        </section>
    </main>

    <footer>
        <p>Created for ApexPlanet Internship - Task 3</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
